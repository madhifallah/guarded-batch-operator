<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guarded Batch Operator architecture</title>
  <style>
    :root { color-scheme: light; background: #f5f5f5; color: #2d3142; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; }
    main { max-width: 1024px; margin: auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1024px; }
    .title { font: 32px 'Instrument Serif', Georgia, serif; fill: #2d3142; }
    .name { font: 600 20px 'Geist', system-ui, sans-serif; fill: #2d3142; }
    .body { font: 15px 'Geist', system-ui, sans-serif; fill: #4f5d75; }
    .tag { font: 11px 'Geist Mono', ui-monospace, monospace; letter-spacing: 1px; fill: #5a6580; }
    .code { font: 13px 'Geist Mono', ui-monospace, monospace; fill: #4f5d75; }
    .edge { fill: none; stroke: #4f5d75; stroke-width: 1.6; marker-end: url(#arrow); }
    .node { fill: #fff; stroke: #4f5d75; stroke-width: 1; }
    .focal { fill: #f5f5f5; stroke: #bf4520; stroke-width: 1.6; }
    @media print {
      body { padding: 0; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
<main>
<div class="diagram-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 672" role="img" aria-labelledby="guarded-architecture-title guarded-architecture-desc">
  <title id="guarded-architecture-title">Guarded Batch Operator: policy-controlled Kubernetes Jobs</title>
  <desc id="guarded-architecture-desc">A Go controller reconciles immutable GuardedRun requests and trusted ConfigMaps, evaluates embedded OPA policies, creates a bounded Job only when execution is permitted, and reports decisions and Job outcomes through status and Events.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker>
  </defs>
  <rect x="0" y="0" width="1024" height="672" fill="#f5f5f5"/>
  <text x="48" y="44" class="tag">GUARDED BATCH OPERATOR / ARCHITECTURE</text>
  <text x="48" y="88" class="title">A policy decision before the Job starts.</text>
  <text x="48" y="120" class="body">Go reconciliation · embedded OPA/Rego · Kubernetes execution</text>

  <rect x="28" y="156" width="968" height="412" rx="8" fill="none" stroke="#bfc0c0" stroke-dasharray="4 4"/>
  <rect x="44" y="148" width="276" height="20" fill="#f5f5f5"/>
  <text x="48" y="164" class="tag">ONE WATCHED KUBERNETES NAMESPACE</text>

  <!-- Inputs, execution, and the separate observation return path. -->
  <path d="M300 252 H392" class="edge"/>
  <path d="M300 400 H392" class="edge"/>
  <path d="M632 252 H748" class="edge"/>
  <path d="M632 400 H748" class="edge"/>
  <path d="M976 284 H980 Q988 284 988 292 V528 Q988 536 980 536 H520 Q512 536 512 528 V480" class="edge" stroke-dasharray="5 4"/>

  <rect x="648" y="204" width="84" height="36" fill="#f5f5f5"/>
  <text x="690" y="218" class="tag" text-anchor="middle">EXECUTE</text>
  <text x="690" y="234" class="tag" text-anchor="middle">+ ALLOW</text>
  <rect x="640" y="368" width="100" height="20" fill="#f5f5f5"/>
  <text x="690" y="382" class="tag" text-anchor="middle">NO EXECUTION</text>
  <rect x="624" y="504" width="128" height="20" fill="#f5f5f5"/>
  <text x="688" y="518" class="tag" text-anchor="middle">OBSERVE JOB</text>

  <g data-node="request">
    <rect x="48" y="196" width="252" height="112" rx="6" class="node"/>
    <text x="68" y="220" class="tag">REQUEST</text>
    <text x="68" y="252" class="name">GuardedRun</text>
    <text x="68" y="280" class="body">Immutable spec + references</text>
  </g>
  <g data-node="configuration">
    <rect x="48" y="352" width="252" height="152" rx="6" fill="#ececec" stroke="#4f5d75"/>
    <text x="68" y="376" class="tag">ADMIN-MAINTAINED CONFIGMAPS</text>
    <text x="68" y="404" class="name">Trusted inputs</text>
    <text x="68" y="432" class="code">Job template · Rego policy</text>
    <text x="68" y="456" class="code">Trusted producer evidence</text>
    <text x="68" y="484" class="body">Demo evidence is synthetic.</text>
  </g>
  <g data-node="controller">
    <rect x="392" y="228" width="240" height="252" rx="6" class="focal"/>
    <text x="412" y="252" class="tag">GO / CONTROLLER-RUNTIME</text>
    <text x="412" y="284" class="name">Reconcile</text>
    <text x="412" y="308" class="body">Validate template</text>
    <text x="412" y="328" class="body">Check Job ownership</text>
    <rect x="412" y="340" width="200" height="116" rx="6" fill="#fff" stroke="#bfc0c0"/>
    <text x="432" y="372" class="name">OPA / Rego</text>
    <text x="432" y="400" class="code">facts + time + job</text>
    <text x="432" y="428" class="body">Errors block execution.</text>
  </g>
  <g data-node="job">
    <rect x="748" y="196" width="228" height="112" rx="6" class="node"/>
    <text x="768" y="220" class="tag">EXECUTION</text>
    <text x="768" y="252" class="name">Kubernetes Job</text>
    <text x="768" y="276" class="body">Deadline + retry ceiling</text>
    <text x="768" y="296" class="body">CPU + memory limits</text>
  </g>
  <g data-node="decision">
    <rect x="748" y="352" width="228" height="136" rx="6" class="node"/>
    <text x="768" y="376" class="tag">DECISION WITHOUT A JOB</text>
    <text x="768" y="408" class="name">No Job created</text>
    <text x="768" y="436" class="body">Denied / error → Blocked</text>
    <text x="768" y="464" class="body">Preview allow → Permitted</text>
  </g>

  <text x="48" y="608" class="body">Status + Events report the decision and execution outcome: Running, Succeeded, or Failed.</text>
  <text x="48" y="640" class="code">Namespace-scoped Role · no Secret reads · workers must tolerate retries</text>
</svg>
</div>
</main>
</body>
</html>
