name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    # This privileged self-hosted pool accepts owner-authored code only.
    if: github.actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, 'gcp-spot-${{ github.run_id }}-${{ github.run_attempt }}-ci-quality-0']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Go, Rego, and generated contracts
        run: make verify
      - name: Kubernetes API integration
        run: make test-integration
      - name: Vulnerability analysis
        run: make security
      - name: Build binary and installation manifest
        run: |
          make build kustomize
          mkdir -p dist
          bin/kustomize build config/default > dist/install.yaml
          cp bin/manager dist/manager-linux-amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: guarded-batch-${{ github.sha }}
          path: |
            coverage.out
            dist/
          retention-days: 7
          if-no-files-found: error
  e2e:
    if: github.actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, 'gcp-spot-${{ github.run_id }}-${{ github.run_attempt }}-ci-e2e-0']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Real Kubernetes Job lifecycle
        run: make test-e2e
