name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    # This privileged self-hosted pool accepts owner-authored code only.
    if: github.actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, 'gcp-spot-${{ github.run_id }}-${{ github.run_attempt }}-ci-quality-0']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Go, Rego, and generated contracts
        run: make verify
      - name: Kubernetes API integration
        run: make test-integration
      - name: Vulnerability analysis
        run: make security
      - name: Build binary and installation manifest
        run: |
          make build kustomize
          mkdir -p dist
          bin/kustomize build config/default > dist/install.yaml
          cp bin/manager dist/manager-linux-amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: guarded-batch-${{ github.sha }}
          path: |
            coverage.out
            dist/
          retention-days: 7
          if-no-files-found: error
  e2e:
    if: github.actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, 'gcp-spot-${{ github.run_id }}-${{ github.run_attempt }}-ci-e2e-0']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Packaged image and real Kubernetes Job lifecycle
        run: make test-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/release/
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: [quality, e2e]
    if: github.actor == github.repository_owner && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Reuse the already-authorized quality pool route after both checks finish.
    runs-on: [self-hosted, Linux, X64, 'gcp-spot-${{ github.run_id }}-${{ github.run_attempt }}-ci-quality-0']
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/release/
      - name: Push qualified image and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: bash scripts/publish-release.sh
