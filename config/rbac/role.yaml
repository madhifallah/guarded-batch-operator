---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
  namespace: system
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - operations.example.org
  resources:
  - guardedruns
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - operations.example.org
  resources:
  - guardedruns/finalizers
  verbs:
  - update
- apiGroups:
  - operations.example.org
  resources:
  - guardedruns/status
  verbs:
  - get
  - patch
  - update
